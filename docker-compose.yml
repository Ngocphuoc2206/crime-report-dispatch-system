services:
  mariadb:
    image: mariadb:11.4
    container_name: crime-report-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: crime_report_dispatch
      MARIADB_USER: crime_user
      MARIADB_PASSWORD: crime_password
      MARIADB_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
