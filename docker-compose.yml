services:
  postgres:
    image: postgres:16-alpine
    container_name: crime-report-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crime_report_dispatch
      POSTGRES_USER: crime_user
      POSTGRES_PASSWORD: crime_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crime_user -d crime_report_dispatch"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: