spring:
  application:
    name: report-service
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crime_report}?useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME:crime_user}
    password: ${DB_PASSWORD:crime_password}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

server:
  port: ${SERVER_PORT:8082}

app:
  encryption:
    secret-base64: ${APP_ENCRYPTION_SECRET_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    key-version: ${APP_ENCRYPTION_KEY_VERSION:v1}
  jwt:
    secret: ${JWT_SECRET:crime-report-dispatch-secret-key-must-be-at-least-32-bytes}

  case-lock:
    ttl-minutes: ${CASE_LOCK_TTL_MINUTES:15}
  internal-token: ${INTERNAL_SERVICE_TOKEN:crime-report-internal-token}

ai:
  spam-detection:
    enabled: ${AI_SPAM_DETECTION_ENABLED:true}
    base-url: ${OPENAI_BASE_URL:}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1}
    timeout-seconds: ${AI_SPAM_TIMEOUT_SECONDS:8}

services:
  evidence:
    base-url: ${EVIDENCE_SERVICE_URL:http://localhost:8083}
  urgency:
    base-url: ${URGENCY_SERVICE_URL:http://localhost:8084}
  dispatch:
    base-url: ${DISPATCH_SERVICE_URL:http://localhost:8085}
