spring:
  application:
    name: urgency-service
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crime_urgency}?useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME:crime_user}
    password: ${DB_PASSWORD:crime_password}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8084}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:crime-report-dispatch-secret-key-must-be-at-least-32-bytes}
  internal-token: ${INTERNAL_SERVICE_TOKEN:crime-report-internal-token}
